services:
  # ============================================================================
  # 1. PostgreSQL Relational State Store
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: strata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: doc_intelligence
      POSTGRES_USER: strata_admin
      POSTGRES_PASSWORD: secure_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata_admin -d doc_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strata-network

  # ============================================================================
  # 2. FastAPI Multi-Agent Orchestrator Gateway
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: reference-learning-kit/04-docker-and-containerization/Dockerfile.example
    container_name: strata-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://strata_admin:secure_dev_password@postgres:5432/doc_intelligence
      - LLM_PROVIDER=simulation # or openai / anthropic
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - strata-network

  # ============================================================================
  # 3. React Analyst Workstation Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strata-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - strata-network

volumes:
  pgdata:
    driver: local

networks:
  strata-network:
    driver: bridge
