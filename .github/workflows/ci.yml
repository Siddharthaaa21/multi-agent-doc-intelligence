name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-eval:
    name: Backend Tests & Regression Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest -v backend/tests

      - name: Run 25-Case Regression Evaluation Benchmark
        env:
          PYTHONPATH: backend
        run: |
          python eval_runner.py

  frontend-quality:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint with Oxlint
        run: npm run lint

      - name: Typecheck and Build Bundle
        run: npm run build

  docker-compose-deployment:
    name: Containerized Build & Deployment Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Container Images
        run: docker compose build

      - name: Launch Services
        run: docker compose up -d

      - name: Await Service Health & Verify Endpoints
        run: |
          echo "Awaiting backend readiness..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/health; then
              echo "Backend is healthy!"
              break
            fi
            echo "Waiting for backend service... ($i/30)"
            sleep 2
          done

          echo "Verifying API endpoints..."
          curl -f http://localhost:8000/api/health
          curl -f http://localhost:8000/api/documents/samples
          curl -f http://localhost:8000/api/metrics/summary
          curl -f http://localhost:8000/api/disputes

          echo "Awaiting frontend service readiness..."
          for i in {1..15}; do
            if curl -sf http://localhost:3000; then
              echo "Frontend is healthy!"
              break
            fi
            echo "Waiting for frontend service... ($i/15)"
            sleep 2
          done
          curl -f http://localhost:3000

      - name: Service Teardown
        if: always()
        run: docker compose down -v
