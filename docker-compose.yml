version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: strata_orchestrator_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-simulation}
      - GUARDRAIL_CONFIDENCE_THRESHOLD=0.95
      - MAX_REFINEMENT_LOOPS=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - strata_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strata_orchestrator_frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - strata_network

networks:
  strata_network:
    driver: bridge
